# OpenAPI Schema for SakuraFrp API v4

openapi: 3.0.3
info:
  title: SakuraFrp API
  version: 4.1.0
  termsOfService: "https://www.natfrp.com/policy/tos"
  license:
    name: GNU Affero General Public License v3.0
    url: "https://www.gnu.org/licenses/agpl-3.0.en.html"
  contact:
    name: SakuraFrp Support
    email: support@natfrp.cloud

servers:
  - url: "https://api.natfrp.com/v4"
    description: SakuraFrp API

tags:
  - name: 系统信息
  - name: 用户信息
  - name: 节点管理
  - name: 隧道管理
  - name: 访问认证
  - name: 计算机管理
  - name: 子域绑定

paths:
  /system/bulletin:
    get:
      operationId: getSystemBulletin
      tags: [系统信息]
      summary: 获取平台公告
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - title
                    - content
                    - icon
                    - time
                    - expand
                  properties:
                    title:
                      type: string
                      description: 公告标题
                      example: 关于 SakuraFrp API 的说明
                    content:
                      type: string
                      description: 公告内容
                      example: Lorem ipsum dolor sit amet, consectetur adipiscing elit
                    time:
                      type: string
                      description: 公告发布时间
                      example: 2023/01/01
                    icon:
                      type: string
                      description: 公告图标
                      example: 😊
                    expand:
                      type: boolean
                      description: 是否默认展开
                      example: true
          description: 返回平台公告列表
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /system/clients:
    get:
      operationId: getSystemClients
      tags: [系统信息]
      summary: 获取客户端软件信息
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  description: 下载分类
                  required:
                    - ver
                    - time
                  properties:
                    ver:
                      type: string
                      description: 版本号
                      example: 3.0.0
                    time:
                      type: integer
                      description: 版本发布时间
                      example: 1620000000
                    note:
                      type: string
                      description: 更新日志
                      example: Ut aliquam purus sit amet luctus venenatis lectus magna fringilla
                    archs:
                      type: object
                      description: 某个分类的架构列表, 仅 download=true 时存在
                      additionalProperties:
                        type: object
                        required:
                          - title
                          - url
                          - hash
                          - size
                        properties:
                          title:
                            type: string
                            description: 下载标题
                            example: Windows 安装程序
                          url:
                            type: string
                            description: 下载链接
                            example: https://nya.globalslb.net/natfrp/client/foo/bar
                          hash:
                            type: string
                            description: 下载文件哈希值
                            example: 1234567890abcdef1234567890abcdef
                          size:
                            type: integer
                            description: 下载文件大小
                            example: 114514
          description: 返回软件下载信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /system/policy:
    get:
      operationId: getSystemPolicy
      tags: [系统信息]
      summary: 获取服务条款和策略
      security: []
      parameters:
        - name: type
          in: query
          description: 策略类型
          required: true
          schema:
            type: string
            enum:
              - tos
              - content
              - privacy
              - rule
              - refund
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - content
                properties:
                  alert:
                    type: string
                    description: 置顶警告框内容
                    example: Habitasse platea dictumst vestibulum rhoncus est pellentesque elit
                  updated:
                    type: string
                    description: 策略更新时间
                    example: 2023/01/04
                  content:
                    type: string
                    description: 策略内容文本
                    example: Nam at lectus urna duis. Sed pulvinar proin gravida hendrerit. Nec feugiat nisl pretium fusce id velit ut tortor pretium.
          description: 返回服务条款和策略
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /user/info:
    get:
      operationId: getUserInfo
      tags: [用户信息]
      summary: 获取用户基本信息
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: ./schemas/UserInfo.yaml
          description: 返回用户信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /user/data_plans:
    get:
      operationId: getUserDataPlans
      tags: [用户信息]
      summary: 获取用户流量包
      parameters:
        - name: status
          in: query
          description: 流量包状态
          schema:
            type: string
            enum:
              - valid
              - invalid
              - all
            default: valid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/DataPlan.yaml
          description: 返回用户流量包信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /user/traffic_history:
    get:
      operationId: getUserTrafficHistory
      tags: [用户信息]
      summary: 获取用户流量历史
      parameters:
        - name: type
          in: query
          description: 查询时间类型
          required: true
          schema:
            type: string
            enum:
              - day
              - week
              - month
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  minItems: 3
                  example:
                    - "2023-01"
                    - 0
                    - 5368709120
                  description: "流量历史数据点, `[时间段, 流量消耗, 流量剩余]`"
          description: 返回用户流量历史
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /user/notification:
    get:
      operationId: getUserNotifications
      tags: [用户信息]
      summary: 获取用户通知列表
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - match
                    - type
                    - title
                    - content
                  properties:
                    match:
                      type: array
                      description: 路由匹配规则列表
                      items:
                        type: string
                      example:
                        - '*'
                        - /tunnel/
                        - /user/*
                    type:
                      type: string
                      description: 通知类型
                      enum:
                        - default
                        - info
                        - success
                        - warning
                        - error
                      example: info
                    title:
                      type: string
                      description: 通知标题
                      example: 非常好通知，爱来自 iDea Leaper
                    content:
                      type: string
                      description: 通知内容
                      example: lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua
          description: 返回通知列表
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /nodes:
    get:
      operationId: listNodes
      tags: [节点管理]
      summary: 列出所有节点
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required:
                    - name
                    - host
                    - description
                    - vip
                    - flag
                  properties:
                    name:
                      type: string
                      description: 节点名称
                      example: 一个神奇的节点
                    host:
                      type: string
                      description: 节点地址
                      example: idea-leaper-1.natfrp.io
                    description:
                      type: string
                      description: 节点说明
                      example: 推荐某些用户使用
                    vip:
                      type: integer
                      description: 节点 VIP 等级
                    flag:
                      type: integer
                      description: |
                        节点 Flag
                        - `0b11`: 允许 HTTP 隧道
                        - `1 << 2`: 是否允许创建隧道 (满载时为 0)
                        - `1 << 3`: 是否为内地节点
                        - `1 << 4`: 是否为无防节点
                        - `1 << 5`: 允许 UDP 流量
                        - `1 << 6`: 是否为私有节点
                        - `1 << 7`: tls_sucks
                        - `1 << 8`: 是否强制启用访问认证
                        - `1 << 9`: 是否离线
                        - `1 << 10`: 是否为 BETA 节点
                        - `1 << 11`: 是否允许穿透公开游戏
                      example: 0
          description: 节点列表
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /node/stats:
    get:
      operationId: getNodeStats
      tags: [节点管理]
      summary: 获取节点状态信息
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - time
                properties:
                  time:
                    type: integer
                    description: 数据更新时间戳
                    example: 1620000000
                  nodes:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - online
                        - uptime
                        - load
                      properties:
                        id:
                          type: integer
                          description: 节点 ID
                          example: 233
                        online:
                          type: integer
                          description: 节点是否在线 (-1 为离线, >= 0 为在线, 通常为 0)
                          example:
                            - 0
                            - -1
                        uptime:
                          type: integer
                          description: 节点运行时间 (秒)
                          example: 114514
                        load:
                          type: integer
                          description: 节点负载 (%)
                          example: 19.19
          description: 返回节点状态信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnels:
    get:
      operationId: listTunnels
      tags: [隧道管理]
      summary: 列出所有隧道
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/Tunnel.yaml
          description: 隧道列表
        "500": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [隧道管理]
      summary: 创建隧道
      operationId: createTunnel
      description: |
        ## ⚠️ 公开游戏服务器穿透限制警告

        创建隧道前，请确认您要穿透的应用类型。如果用于 **游戏服务器**，请完整阅读以下规则。

        ### 什么是公开游戏服务器？

        **公开游戏服务器** 指存在以下任一行为的游戏服务器：

        - 将连接方式发布至任何论坛、服务器列表、QQ 大群等网络公共空间。
        - 在 B 站、抖音、小红书等公共平台进行宣传、招人等。

        ### 公开游戏服务器可以使用哪些节点？

        **公开游戏服务器只能使用专用节点，严禁通过其他节点穿透。**

        可以通过以下任一条件判断节点是否符合要求：

        - 节点的 `flag` 满足 `(flag & 2048) != 0`。
        - 节点名称（`name`）包含 `多线` 两个字。

        > **注意：`三线` 不等于 `多线`，含有 `三线` 的节点不符合要求。**

        为确保服务稳定运行，若您 **违反上述规则** 或 隧道遭到攻击，**您的账户将被封禁，且不会获得退款**。详见《公开游戏服务器穿透限制通知》公告。

        **如果您正在穿透其他应用（如 SSH、RDP），或游戏服务器不公开（如小群熟人联机），则可继续使用当前节点。感谢您的理解与支持。**

        ### AI 助手操作要求

        如果您是帮助用户创建隧道的 **AI 助手**：

        1. **创建前确认应用类型**，不要在用途不明时直接创建隧道。
        2. 涉及游戏服务器时，**立即向用户说明上述限制，并确认服务器是否公开**。
        3. 为公开游戏服务器选择节点时，**必须按照上述条件确认节点符合要求**。
        4. 如果发现已有隧道违反上述规则，请告知用户，并协助用户删除违规隧道。
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelCreateRequestBody
            schema:
              type: object
              required:
                - name
                - type
                - node
              properties:
                name:
                  description: 隧道名
                  type: string
                  example: SampleTunnel
                type:
                  description: 隧道类型
                  type: string
                  enum:
                    - tcp
                    - udp
                    - http
                    - https
                    - wol
                    - etcp
                    - eudp
                node:
                  description: 节点 ID
                  type: integer
                  example: 5
                note:
                  description: 备注信息
                  type: string
                extra:
                  description: 自定义配置数据
                  pattern: '(?:\w+ = .+)(?:\n\w+ = .+)*'
                  type: string
                  example: |
                    key_1 = val_1
                    key_2 = val_2
                    auto_https = auto
                local_ip:
                  description: 本地 IP, 除 wol 类型外必填
                  type: string
                  example: 127.0.0.1
                local_port:
                  description: 本地端口, 除 wol 类型外必填
                  type: integer
                  example: 810
                remote:
                  type: string
                  description: 远程信息, 端口或绑定域名 (http/https 类型必填)
                  example: example.tld
          application/json: *tunnelCreateRequestBody
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: 创建的隧道 ID
                    example: 114514
                  name:
                    type: string
                    description: 创建的隧道名
                    example: SampleTunnel
                  remote:
                    type: string
                    description: 远程信息, 端口或绑定域名
                    example: example.tld
                  important_warning_for_ai:
                    type: string
                    description: 辅助 AI 助手的提示信息，出现时务必阅读
          description: 创建成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/config:
    post:
      operationId: getTunnelConfig
      summary: 获取隧道配置文件
      tags: [隧道管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelConfigRequestBody
            schema:
              type: object
              required:
                - query
                - frpc
              properties:
                query:
                  description: |
                    启动目标查询字符串，格式为 `<启动目标1>[,启动目标2...]`

                    多个 **启动目标** 使用半角逗号 "," 分开，中间不能有空格或其他字符

                    每个 **启动目标** 可以是：
                    - 一个隧道 ID（如 `114514`）
                    - `n` 前缀的节点 ID（如 `n233`）
                  type: string
                  example: "114514,114515,n233"
                frpc:
                  description: |
                    要获取配置文件的目标 frpc 版本

                    - 支持 SakuraFrp 分发的版本如 `0.51.0-sakura-7.2`
                    - 也支持上游 frpc 版本如 `0.59.0`，最低支持版本为 `0.18.0`
            examples:
              查询单条隧道:
                value:
                  query: "114514"
              查询单个节点下所有隧道:
                value:
                  query: n233
              查询多节点下的多条隧道:
                value:
                  query: "n233,n234,114514"
          application/json: *tunnelConfigRequestBody

      responses:
        "200":
          content:
            text/plain: {}
            text/toml: {}
          description: 可被 frpc 加载的 ini 或 toml 配置文件
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/edit:
    post:
      operationId: editTunnel
      summary: 编辑隧道
      tags: [隧道管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelEditRequestBody
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: 隧道 ID
                  example: 114514
                note:
                  type: string
                  description: 隧道备注
                  example: SampleTunnel
                local_ip:
                  type: string
                  description: 本地 IP
                  example: 127.0.0.1
                local_port:
                  type: integer
                  description: 本地端口
                  example: 114514
                extra:
                  type: string
                  description: 额外参数列表
                  example: "key=value\nkey2=value2"
          application/json: *tunnelEditRequestBody
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - extra
                properties:
                  extra:
                    type: string
                    description: 处理后的额外参数列表
                    example: "key=value\nkey2=value2"
          description: 服务端处理后的参数
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/lock:
    post:
      operationId: lockTunnel
      summary: 锁定隧道
      tags: [隧道管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelLockRequestBody
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: 隧道 ID
                  example: 114514
                edit:
                  type: boolean
                  description: 更新锁定编辑状态
                  example: true
                delete:
                  type: boolean
                  description: 更新锁定删除状态
                  example: true
                migrate:
                  type: boolean
                  description: 更新锁定迁移状态
                  example: true
          application/json: *tunnelLockRequestBody
      responses:
        "204":
          description: 锁定状态修改成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/migrate:
    post:
      operationId: migrateTunnel
      summary: 迁移隧道
      tags: [隧道管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelMigrateRequestBody
            schema:
              type: object
              required:
                - id
                - node
              properties:
                id:
                  type: integer
                  description: 隧道 ID
                  example: 114514
                node:
                  type: integer
                  description: 目标节点 ID
                  example: 233
          application/json: *tunnelMigrateRequestBody
      responses:
        "204":
          description: 迁移成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/delete:
    post:
      operationId: deleteTunnels
      summary: 删除隧道
      tags: [隧道管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &deleteTunnelRequestBody
            schema:
              type: object
              properties:
                ids:
                  description: 以 `,` 分隔的隧道 ID 列表，最大支持 10 条隧道
                  type: string
                  example: 114514,1919,810
          application/json: *deleteTunnelRequestBody
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                  - failed
                properties:
                  deleted:
                    type: array
                    items:
                      type: integer
                    description: 被删除的隧道 ID 列表
                    example:
                      - 114514
                      - 114515
                  failed:
                    type: array
                    items:
                      type: integer
                    description: 已删除但未能成功踢下线的隧道 ID 列表
                    example:
                      - 1919
          description: 删除成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/traffic:
    get:
      operationId: getTunnelTraffic
      summary: 获取流量使用记录
      tags: [隧道管理]
      parameters:
        - name: id
          in: query
          description: 隧道 ID
          required: true
          schema:
            type: integer
            description: 隧道 ID
            example: 114514
      description: 返回 `Timestamp[Traffic]`
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
          description: 隧道流量历史记录
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/auth:
    post:
      operationId: authorizeTunnelIp
      summary: 授权 IP 访问隧道
      tags: [访问认证]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelAuthRequestBody
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  description: 隧道 ID
                  type: integer
                  example: 114514
                ip:
                  description: 要授权的 IP，留空授权请求 IP
                  type: string
                  example: "114.51.4.191"
          application/json: *tunnelAuthRequestBody
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                description: 授权成功的 IP
                example: "114.51.4.191"
          description: 授权成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /tunnel/auth_query:
    post:
      operationId: queryTunnelForAuth
      summary: 根据节点 IP 和端口查询隧道，用于访问认证授权
      tags: [访问认证]
      requestBody:
        content:
          application/x-www-form-urlencoded: &tunnelRemoteQueryRequestBody
            schema:
              type: object
              required:
                - ip
                - port
              properties:
                ip:
                  description: 节点 IP
                  type: string
                  example: "114.51.4.191"
                port:
                  description: 隧道远程端口
                  type: integer
                  example: 114514
          application/json: *tunnelRemoteQueryRequestBody
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: 隧道 ID
                    example: 114514
                  name:
                    type: string
                    description: 隧道名
                    example: SampleTunnel
          description: 查询到的隧道信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /computers:
    get:
      operationId: listComputers
      summary: 获取计算机列表
      tags: [计算机管理]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/ComputerWithId.yaml
          description: 计算机列表
        "500": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: 添加计算机
      operationId: createComputer
      tags: [计算机管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &addComputerRequestBody
            schema:
              $ref: ./schemas/Computer.yaml
          application/json: *addComputerRequestBody
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    description: 计算机 ID
                    example: 114514
          description: 创建成功
        "500": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      summary: 更新计算机信息
      operationId: updateComputer
      tags: [计算机管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &updateComputersRequestBody
            schema:
              $ref: ./schemas/ComputerWithId.yaml
          application/json: *updateComputersRequestBody
      responses:
        "204":
          description: 更新成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /computer/delete:
    post:
      operationId: deleteComputer
      summary: 删除计算机
      tags: [计算机管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &deleteComputerRequestBody
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: 计算机 ID
                  example: 1001
          application/json: *deleteComputerRequestBody
      responses:
        "204":
          description: 删除成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /computer/poweron:
    post:
      operationId: powerOnComputer
      summary: 执行远程开机
      tags: [计算机管理]
      requestBody:
        content:
          application/x-www-form-urlencoded: &powerOnRequestBody
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: 计算机 ID
                  example: 1001
                password:
                  type: string
                  description: 远程开机客户端密码
                  example: "wdnmdpassword"
          application/json: *powerOnRequestBody
      responses:
        "204":
          description: 开机成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /domain/get:
    get:
      operationId: getDomain
      summary: 获取子域绑定功能相关数据
      tags: [子域绑定]
      description: |
        使用子域绑定功能需完成实名认证，并具备子域绑定权限。
        返回账户域名、绑定记录、证书状态及可用配置。
        domain 表示已分配的域名，acquire 提供可申请的域名风格。
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                properties: &domainGetResponseProps
                  domain:
                    type: string
                    description: 当前账户申请到的子域名，申请成功后返回
                    example: "example.nyat.app"
                  records:
                    type: array
                    description: 账户中的子域名记录列表
                    items:
                      type: object
                      required:
                        - rr
                        - type
                        - tunnel
                      properties:
                        rr:
                          type: string
                          description: 相对账户域名的记录名；SRV 记录包含应用和协议前缀
                          example: "www"
                        type:
                          type: string
                          description: 记录类型
                          example: "CNAME"
                          enum:
                            - CNAME
                            - SRV
                        tunnel:
                          type: integer
                          description: 记录绑定到的隧道 ID
                          example: 114514
                  ssl:
                    type: object
                    description: |
                      证书签发开始后返回此对象；expires 缺省或为 0 表示签发中。
                      expires 为到期时间戳，可与当前时间比较以判断证书有效期。
                      首次通过 frpc 自动 HTTPS 拉取证书时自动触发签发，
                      到期前 7 天自动续签活跃 (指 5 天内通过自动 HTTPS 加载过) 证书。
                    required:
                      - created
                    properties:
                      created:
                        type: integer
                        format: int64
                        description: 当前证书的创建时间
                        example: 1620000000
                      expires:
                        type: integer
                        format: int64
                        description: 证书到期时间，缺省或 0 表示签发中
                        example: 1627776000
                  words:
                    type: array
                    description: 允许创建记录的关键词白名单，@ 表示账户域名本身
                    items:
                      type: string
                    example: ["@", www, game, server]
                  srv_apps:
                    type: object
                    description: |
                      SRV 应用白名单；键为包含协议的服务前缀，例如 _minecraft._tcp，值为应用名称
                    additionalProperties:
                      type: string
                    example:
                      _minecraft._tcp: Minecraft Java 版
                  acquire:
                    type: object
                    description: 允许申请的子域名风格；对象的键用于申请接口的 type 参数
                    additionalProperties:
                      type: object
                      required:
                        - desc
                        - val
                      properties:
                        desc:
                          type: string
                          description: 风格名称
                          example: "UID 前缀"
                        val:
                          type: string
                          description: 风格示例前缀；随机风格以申请结果为准
                          example: "u114514"
          description: 子域绑定功能相关数据
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /domain/acquire:
    post:
      operationId: acquireDomain
      summary: 申请子域名
      tags: [子域绑定]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: 域名风格，取自 acquire 对象的键
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - domain
                  - records
                properties: *domainGetResponseProps
          description: 申请成功，返回完整的子域绑定信息
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /domain/bind:
    post:
      operationId: bindDomain
      summary: 创建或删除隧道子域名
      tags: [子域绑定]
      description: |
        记录名与隧道选择规则：
        - 每个隧道对应一条绑定记录，子域名可绑定 `TCP`、`UDP` 隧道
        - 普通记录名从 `words` 白名单选择 1 ~ 3 个词，以 "-" 连接
        - @ 表示账户获分配的域名本身，作为独立记录名使用 (以 `/domain/get` 返回结果为准，没有返回则不支持)
        - CNAME 的 rr 为普通记录名，例如 `www`、`my-server` 或 `@`
        - SRV 的 rr 为 srv_apps 对象的键加上普通记录名，例如 `_minecraft._tcp.game` 或 `_minecraft._tcp.@`

        创建 / 删除绑定后需重新拉取对应的隧道配置。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - rr
                - tunnel
                - domain
                - type
              properties:
                rr:
                  type: string
                  description: 相对账户域名的记录名；SRV 记录包含应用和协议前缀
                  example: www
                tunnel:
                  type: integer
                  minimum: 0
                  description: 目标隧道 ID，`0` 表示删除记录
                  example: 114514
                domain:
                  type: string
                  description: GET /domain/get 返回的账户域名
                  example: example.nyat.app
                type:
                  type: string
                  description: DNS 记录类型
                  enum: [CNAME, SRV]
            examples:
              cname:
                summary: 创建 CNAME 绑定
                value:
                  rr: www
                  tunnel: 114514
                  domain: example.nyat.app
                  type: CNAME
              cname_segments:
                summary: 创建多词组合的 CNAME 绑定
                value:
                  rr: nas-www
                  tunnel: 114514
                  domain: example.nyat.app
                  type: CNAME
              srv:
                summary: 创建 SRV 绑定，应用键须存在于 srv_apps 中
                value:
                  rr: _minecraft._tcp.game
                  tunnel: 114515
                  domain: example.nyat.app
                  type: SRV
              delete:
                summary: 删除绑定
                value:
                  rr: www
                  tunnel: 0
                  domain: example.nyat.app
                  type: CNAME
      responses:
        "204":
          description: 操作成功
        "500": { $ref: "#/components/responses/ErrorResponse" }

  /domain/cert:
    get:
      operationId: getDomainCertificate
      summary: 下载子域名 SSL 证书及私钥
      tags: [子域绑定]
      description: |
        下载内容包含私钥，请妥善保管。手动配置证书后，请在续签完成时同步更新证书文件。**请将证书妥善保存到本地，避免频繁调用下载接口。**
      parameters:
        - name: created
          in: query
          required: true
          description: 当前证书的创建时间
          schema:
            type: integer
            format: int64
            example: 1620000000
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - key
                  - cert
                properties:
                  key:
                    type: string
                    description: 私钥文本
                  cert:
                    type: string
                    description: 证书文本
          description: 返回证书及私钥文本
        "500": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: 提交子域名 SSL 证书续签申请
      operationId: renewDomainCertificate
      tags: [子域绑定]
      description: |
        适用于到期前 7 天内或已过期的已签发证书。
        申请条件为 `ssl.expires` > 0 且 `ssl.expires` < 当前 Unix 时间戳 + 604800。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - created
                - renew
              properties:
                created:
                  type: integer
                  format: int64
                  description: 当前证书的创建时间
                  example: 1620000000
                renew:
                  type: boolean
                  enum: [true]
                  description: 提交续签请求
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: 续签请求成功，返回操作提示文本
        "500": { $ref: "#/components/responses/ErrorResponse" }

components:
  responses:
    ErrorResponse:
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - msg
            properties:
              code:
                description: 错误代码
                type: integer
                example: 403
              msg:
                description: 人类友好的错误信息
                type: string
                example: 无权访问
      description: 通用错误返回

  securitySchemes:
    # PanelSessionCookie:
    #   type: apiKey
    #   description: 主站 PHP Session 认证
    #   name: PHPSESSID
    #   in: cookie
    UserToken:
      scheme: bearer
      type: http
      description: 访问密钥认证 - Bearer Token
    UserTokenPost:
      type: apiKey
      description: 访问密钥认证 - POST 参数
      name: token
      in: query

security:
  - UserToken: []
  - UserTokenPost: []
  # - PanelSessionCookie: []
